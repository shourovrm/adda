<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=1.3">
  <link rel="stylesheet" href="/static/style.css?v=1.3">
  <link rel="stylesheet" href="/static/rooms.css?v=1.3">
  <title>Rooms · Adda</title>
  <script src="/static/common.js?v=1.3" defer></script>
  <script src="/static/rooms.js?v=1.3" defer></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/"><img class="brand-mark" src="/static/logo.svg?v=1.3" width="28" height="28" alt="">Adda <small lang="bn">আড্ডা</small></a>
    <nav aria-label="Pages">
      <a href="/" aria-current="page">Rooms</a>
      <a href="/settings">Settings</a>
      <span class="owner-name" id="owner-name"></span>
    </nav>
  </header>

  <main class="page">
    <div class="page-head page-head--action">
      <div>
        <h1 id="rooms-title">Rooms</h1>
      </div>
      <button class="btn btn--primary" id="new-room-button" type="button">New room</button>
    </div>

    <form class="panel new-room" id="new-room-form" hidden>
      <div class="panel-head">
        <h2>New room</h2>
        <button class="btn" id="cancel-room-button" type="button">Cancel</button>
      </div>

      <div class="field">
        <label for="room-title-input">Name</label>
        <input type="text" id="room-title-input" required maxlength="200" autocomplete="off" placeholder="What should they discuss?">
      </div>

      <div class="field">
        <label for="room-folder-input">Room folder</label>
        <div class="input-row">
          <input type="text" id="room-folder-input" autocomplete="off">
          <button class="btn" id="browse-folder-button" type="button">Browse folders</button>
        </div>
        <div class="hint">Created if it does not exist.</div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="room-budget-input">Budget</label>
          <input type="number" id="room-budget-input" min="0" step="0.25">
          <div class="hint">In dollars. 0 means no limit.</div>
        </div>
        <div class="field">
          <label for="room-cooldown-input">Cooldown (seconds)</label>
          <input class="input--10" type="number" id="room-cooldown-input" min="0" step="1">
          <div class="hint">A seat stays quiet this long after replying. 0 turns it off.</div>
        </div>
        <div class="field">
          <label for="room-mode-select">Speaking order</label>
          <select id="room-mode-select">
            <option value="bidding">Automatic</option>
            <option value="roundrobin">Take turns</option>
            <option value="manual">Only when mentioned</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="room-liveliness-input">Liveliness <span id="room-liveliness-value"></span></label>
        <input class="slider" type="range" id="room-liveliness-input" min="0" max="10" step="1">
        <div class="scale small mute"><span>Quiet</span><span>Lively</span></div>
        <div class="hint" id="room-liveliness-sentence"></div>
      </div>

      <div class="field">
        <label for="room-max-concurrent-select">Seats replying at once</label>
        <select id="room-max-concurrent-select">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
        </select>
      </div>

      <div class="field">
        <label for="room-access-select">Access</label>
        <select id="room-access-select"></select>
        <div class="hint" id="room-access-description"></div>
        <div class="access-warning" id="room-access-warning" hidden></div>
      </div>

      <h3>Seats</h3>
      <p class="small mute seats-intro">Two seats with one persona share its memory.</p>
      <div class="seat-table" id="seat-table"></div>
      <div class="button-row">
        <button class="btn" id="add-seat-button" type="button">Add seat</button>
        <button class="btn" id="last-seats-button" type="button">Same seats as last room</button>
      </div>

      <div class="summary">
        <div class="small" id="room-summary"></div>
      </div>
      <div class="button-row">
        <button class="btn btn--primary" id="open-room-button" type="submit">Create room</button>
      </div>
    </form>

    <section class="room-section" aria-labelledby="rooms-title">
      <div id="room-list" aria-live="polite"></div>
    </section>

    <section class="panel" aria-labelledby="harness-title">
      <h2 id="harness-title">Agents on this machine</h2>
      <table class="harness-table"><tbody id="harness-list"></tbody></table>
      <p class="small"><a href="/settings">Agents, models and keys</a></p>
    </section>
  </main>

  <dialog class="folder-dialog" id="folder-dialog" aria-labelledby="folder-dialog-title">
    <h2 id="folder-dialog-title">Choose a folder</h2>
    <div class="folder-bar">
      <button class="btn" id="folder-up-button" type="button">Up</button>
      <code class="folder-path" id="folder-dialog-path"></code>
    </div>
    <ul class="folder-list" id="folder-list" aria-label="Folders"></ul>
    <form class="folder-new" id="folder-new-form" hidden>
      <label class="visually-hidden" for="folder-new-name">New folder name</label>
      <input type="text" id="folder-new-name" placeholder="New folder name" autocomplete="off" maxlength="120">
      <button class="btn" type="submit">Create folder</button>
    </form>
    <div class="folder-actions">
      <button class="btn" id="folder-open-button" type="button">Open folder</button>
      <button class="btn" id="folder-new-button" type="button">New folder</button>
      <span class="spacer"></span>
      <button class="btn" id="folder-cancel-button" type="button">Cancel</button>
      <button class="btn" id="folder-choose-button" type="button">Choose</button>
    </div>
  </dialog>
</body>
</html>
